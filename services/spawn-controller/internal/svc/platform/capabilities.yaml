# Capability catalog: the closed set of names a grant can hold. A
# grant is exactly one name from this list — no conditions, no
# scopes. Rights live only in the layer chain's grants; this file is
# the vocabulary. A tool cites capabilities from here and cannot add
# new ones; a passport naming a capability absent here is invalid
# and its activation is refused.
# summary: what the grant permits; why: why it exists at all.
capabilities:
  - name: tools.use
    summary: Invoke the tools the effective spec projects.
    why: Tool calls are the agent's actuators; without this grant the
      projection is empty and no call is admitted.
  - name: config.edit_own
    summary: Edit own config-layer leaves.
    why: Owners delegate routine tuning without handing over the
      whole chain.
  - name: persona.edit_own
    summary: Edit own persona documents.
    why: Persona is agent-authored state; editing it must not require
      owner rights.
  - name: workspace.read
    summary: Read files in own workspace.
    why: Recall and citation need read access to the agent's own
      durable files.
  - name: workspace.write
    summary: Write files in own workspace.
    why: Durable notes and artifacts need a write path that is
      separate from reading.
  - name: terminal.exec
    summary: Run bounded commands in an isolated worker for the current space.
    why: Terminal execution needs an explicit grant independent of file tools.
  - name: memory.capture
    summary: Store a memory entry.
    why: Remembering is a write into shared recall and must be
      admitted explicitly.
  - name: memory.search
    summary: Search own memory entries.
    why: Recall is read-only but still a boundary worth naming.
  - name: memory.propose
    summary: Propose a memory entry for owner review.
    why: Some memories should be suggested, not written; a weaker
      right keeps that path open.
