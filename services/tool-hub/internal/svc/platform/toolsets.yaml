# Toolset registry: the model-facing tool model in three levels —
# a toolset (what the model sees) names its executor, the executor
# names its provider. Executors are the closed set toolhub, harness,
# mcp, cli, remote; only toolhub exists in this phase, so no `via`
# field is needed — the admission path derives from the executor.
# Every tool names exactly one capability from the platform catalog;
# a tool cannot introduce a new right.
toolsets:
  - name: probe
    executor: toolhub
    provider: builtin
    tools:
      - name: probe_echo
        description: Return the given string unchanged.
        capability: tools.use
        parameters: &echo_args
          type: object
          properties:
            text:
              type: string
          required: [text]
