# Toolset registry for the toolhub executor selected by the passport.
# Every tool names exactly one capability from the platform catalog;
# a tool cannot introduce a new right.
toolsets:
  - name: probe
    provider: builtin
    tools:
      - name: probe_echo
        description: Return the given string unchanged.
        capability: tools.use
        parameters: &echo_args
          type: object
          properties:
            text:
              type: string
          required: [text]
  - name: ownerreq
    provider: ownerreq
    tools:
      - name: ask
        description: Ask the owner a free-text question and wait for the answer.
        capability: tools.use
        parameters:
          type: object
          properties:
            question:
              type: string
          required: [question]
      - name: choose
        description: Offer the owner a numbered choice and wait for the pick.
        capability: tools.use
        parameters:
          type: object
          properties:
            question:
              type: string
            options:
              type: array
              items:
                type: string
          required: [question, options]
