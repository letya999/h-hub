name: check
# One workflow, one required status (enforcement.md 7).
on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hhub
          key: hhub-dev-${{ hashFiles('go.sum', 'deploy/dev.Dockerfile', 'deploy/sqlcipher-base.ref') }}
      - name: GHCR login
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build hhub-dev
        run: docker build -f deploy/dev.Dockerfile --build-arg "SQLCIPHER_BASE=$(cat deploy/sqlcipher-base.ref)" -t hhub-dev:ci .
      - name: Prepare stack
        run: |
          mkdir -p ~/.cache/hhub/root
          id=$(docker create hhub-dev:ci)
          docker cp "$id:/usr/local/bin/just" "$RUNNER_TEMP/just"
          docker rm "$id"
          export PATH="$RUNNER_TEMP:$PATH"
          docker images -q --no-trunc hhub-dev:ci > deploy/dev-image.ref
          docker tag hhub-dev:ci hhub-dev:0.0.1
          "$RUNNER_TEMP/just" stack
      - name: just check
        run: |
          docker compose -f deploy/compose.yaml up -d --wait postgres
          docker run --rm --network hhub \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e "HHUB_TEST_DSN=postgres://postgres@postgres:5432/postgres?sslmode=disable" \
            -e "HHUB_ADMIN_DSN=postgres://postgres@postgres:5432/postgres?sslmode=disable" \
            -e HHUB_TASK_URL=http://task-engine:9000 \
            -e HHUB_SPAWN_URL=http://spawn-controller:9000 \
            -e HHUB_IDENTITY_URL=http://identity-hub:9000 \
            -e HHUB_MODEL_URL=http://model-gateway:9000 \
            -e HHUB_BROKER_URL=http://credential-broker:9000 \
            -v "$PWD:/src:ro" \
            -v hhub-conf:/etc/hhub:ro \
            -v hhub_hhub-space-worker-sockets:/run/hhub-worker-slots:ro \
            -v "$PWD/../h-hub-data/secrets:/run/hhub-secrets:ro" \
            -v ~/.cache/hhub/root:/root/.cache \
            hhub-dev:ci just check
      - name: N-1 rollback smoke
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          export PATH="$RUNNER_TEMP:$PATH"
          "$RUNNER_TEMP/just" backup with-session
          "$RUNNER_TEMP/just" nminus1-smoke
