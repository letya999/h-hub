version: 1
# Single source of truth for the service inventory (rules 3, 7-11).
# Ceilings are initial values pending first measured builds (blueprint 7).
postgres:
  image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
  mem: 512m
  cpu: 1.0
  pids: 200
  volume: postgres-data
volumes:
  - name: postgres-data
  - name: broker-data
  - name: memory-vault
  - name: hhub-render
  - name: keys-identity-hub
  - name: keys-task-engine
  - name: keys-spawn-controller
services:
  - name: spawn-controller
    zone: control
    deploy: true
    database: postgres
    mem: 128m
    cpu: 0.5
    pids: 256
    env:
      - HHUB_SUB
      - HHUB_DSN
      - HHUB_KEYS
      - HHUB_RUNTIME_IMAGE
      - HHUB_DOCKER_SOCK
      - HHUB_TASK_URL
      - HHUB_MODEL_URL
      - HHUB_RENDER_VOL
      - HHUB_RENDER_DIR
      - HHUB_NETWORK
    volumes:
      - name: keys-spawn-controller
        path: /etc/hhub
      - name: hhub-render
        path: /render
        rw: true
    edges: []
  - name: identity-hub
    zone: control
    deploy: true
    database: postgres
    mem: 128m
    cpu: 0.5
    pids: 256
    env:
      - HHUB_SUB
      - HHUB_DSN
      - HHUB_KEYS
    volumes:
      - name: keys-identity-hub
        path: /etc/hhub
    edges: []
  - name: task-engine
    zone: control
    deploy: true
    database: postgres
    mem: 128m
    cpu: 0.5
    pids: 256
    env:
      - HHUB_SUB
      - HHUB_DSN
      - HHUB_KEYS
      - HHUB_IDENTITY_URL
      - HHUB_SPAWN_URL
    volumes:
      - name: keys-task-engine
        path: /etc/hhub
    edges:
      - to: identity-hub
        ops: [MintRunToken]
      - to: spawn-controller
        ops: [EnsureRuntime, ReleaseRuntime, ResolveSpec]
      - to: harness-runtime
        ops: [SubmitRun, CancelRun]
  - name: harness-runtime
    zone: space
    deploy: false
    database: none
    mem: 256m
    cpu: 1.0
    pids: 256
    env:
      - HHUB_SUB
      - HHUB_CONFIG
    volumes: []
    edges:
      - to: task-engine
        ops: [ReportRun]
  - name: proactive-engine
    zone: control
    database: postgres
    mem: 128m
    cpu: 0.5
    pids: 256
    env: []
    volumes: []
    edges: []
  - name: tool-hub
    zone: agent
    database: postgres
    mem: 128m
    cpu: 0.5
    pids: 256
    env: []
    volumes: []
    edges: []
  - name: memory-hub
    zone: agent
    database: postgres
    mem: 192m
    cpu: 0.5
    pids: 256
    env: []
    volumes:
      - name: memory-vault
        path: /vault
    edges: []
  - name: channel-hub
    zone: edge
    database: postgres
    mem: 128m
    cpu: 0.5
    pids: 256
    env: []
    volumes: []
    edges: []
  - name: ingress-gateway
    zone: edge
    database: none
    mem: 64m
    cpu: 0.25
    pids: 128
    env: []
    volumes: []
    edges: []
  - name: credential-broker
    zone: secret
    database: sqlcipher
    mem: 128m
    cpu: 0.5
    pids: 256
    env: []
    volumes:
      - name: broker-data
        path: /data
    edges: []
  - name: egress-gateway
    zone: egress
    database: none
    mem: 64m
    cpu: 0.25
    pids: 128
    env: []
    volumes: []
    edges: []
  - name: model-gateway
    zone: egress
    database: postgres
    mem: 128m
    cpu: 0.5
    pids: 256
    env: []
    volumes: []
    edges: []
clients:
  - name: operator
    edges:
      - to: identity-hub
        ops: [ActAs]
      - to: task-engine
        ops: [CreateJob, GetJob, ListJobs, CancelJob, RetryJob,
              UnquarantineJob, SetHold, GetRun]
      - to: spawn-controller
        ops: [CreateSpace, GetSpace, DestroySpace]
