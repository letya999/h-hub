version: 1
# Single source of truth for the service inventory (rules 3, 7-11).
# Ceilings are initial values pending first measured builds (blueprint 7).
postgres:
  image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
  mem: 512m
  cpu: 1.0
  pids: 200
  volume: postgres-data
volumes:
  - name: postgres-data
  - name: broker-data
  - name: memory-vault
  - name: hhub-render
  - name: cliproxy-auth
  - name: keys-identity-hub
  - name: keys-task-engine
  - name: keys-channel-hub
  - name: keys-spawn-controller
  - name: keys-model-gateway
  - name: keys-tool-hub
  - name: keys-credential-broker
services:
  - name: spawn-controller
    zone: control
    deploy: true
    database: postgres
    mem: 128m
    cpu: 0.5
    pids: 256
    env:
      - HHUB_SUB
      - HHUB_DSN
      - HHUB_KEYS
      - HHUB_RUNTIME_IMAGE
      - HHUB_DOCKER_SOCK
      - HHUB_TASK_URL
      - HHUB_MODEL_URL
      - HHUB_RENDER_VOL
      - HHUB_IDENTITY_URL
      - HHUB_NETWORK
    volumes:
      - name: keys-spawn-controller
        path: /etc/hhub
      - name: hhub-render
        path: /render
        rw: true
    edges:
      - to: tool-hub
        ops: [Projection]
  - name: identity-hub
    zone: control
    deploy: true
    database: postgres
    mem: 128m
    cpu: 0.5
    pids: 256
    env:
      - HHUB_SUB
      - HHUB_DSN
      - HHUB_KEYS
      - HHUB_KEK_PATH
    volumes:
      - name: keys-identity-hub
        path: /etc/hhub
    edges: []
  - name: task-engine
    zone: control
    deploy: true
    database: postgres
    mem: 128m
    cpu: 0.5
    pids: 256
    env:
      - HHUB_SUB
      - HHUB_DSN
      - HHUB_KEYS
      - HHUB_IDENTITY_URL
      - HHUB_SPAWN_URL
      - HHUB_CHANNEL_URL
      - HHUB_TOOL_URL
    volumes:
      - name: keys-task-engine
        path: /etc/hhub
    edges:
      - to: identity-hub
        ops: [MintRunToken]
      - to: spawn-controller
        ops: [EnsureRuntime, ReleaseRuntime, ResolveSpec]
      - to: channel-hub
        ops: [Alert]
      - to: harness-runtime
        ops: [SubmitRun, CancelRun]
      - to: tool-hub
        ops: [CreateRequest, GetRequest, BindRequest]
  - name: harness-runtime
    zone: space
    deploy: false
    database: none
    mem: 384m
    cpu: 1.0
    pids: 256
    env:
      - HHUB_SUB
      - HHUB_CONFIG
    volumes: []
    edges:
      - to: task-engine
        ops: [ReportRun]
      - to: model-gateway
        ops: [Complete]
      - to: tool-hub
        ops: [AdmitCall, Projection, Invoke]
  - name: proactive-engine
    zone: control
    database: postgres
    mem: 128m
    cpu: 0.5
    pids: 256
    env: []
    volumes: []
    edges: []
  - name: tool-hub
    zone: agent
    deploy: true
    database: postgres
    mem: 128m
    cpu: 0.5
    pids: 256
    env:
      - HHUB_SUB
      - HHUB_DSN
      - HHUB_KEYS
      - HHUB_IDENTITY_URL
      - HHUB_SPAWN_URL
      - HHUB_CHANNEL_URL
      - HHUB_TASK_URL
    volumes:
      - name: keys-tool-hub
        path: /etc/hhub
    edges:
      - to: spawn-controller
        ops: [ResolveSpec, Workspace]
      - to: identity-hub
        ops: [Resolve]
      - to: channel-hub
        ops: [DeliverRequest, RetractRequest]
      - to: task-engine
        ops: [GetRequestTurn]
  - name: memory-hub
    zone: agent
    database: postgres
    mem: 192m
    cpu: 0.5
    pids: 256
    env: []
    volumes:
      - name: memory-vault
        path: /vault
    edges: []
  - name: channel-hub
    zone: edge
    deploy: true
    database: postgres
    mem: 128m
    cpu: 0.5
    pids: 256
    env:
      - HHUB_SUB
      - HHUB_DSN
      - HHUB_KEYS
      - HHUB_IDENTITY_URL
      - HHUB_TASK_URL
      - HHUB_SPAWN_URL
      - HHUB_MODEL_URL
      - HHUB_BROKER_URL
      - HHUB_TOOL_URL
    volumes:
      - name: keys-channel-hub
        path: /etc/hhub
    edges:
      - to: identity-hub
        ops: [LinkConfirm, Resolve, MintLinkToken]
      - to: task-engine
        ops: [CreateJob, GetJob, ListJobs, CancelJob]
      - to: spawn-controller
        ops: [WatchdogStatus, SetModel]
      - to: model-gateway
        ops: [Usage, Routes]
      - to: credential-broker
        ops: [Acquire, Revoke]
      - to: tool-hub
        ops: [AnswerRequest]
  - name: ingress-gateway
    zone: edge
    database: none
    mem: 64m
    cpu: 0.25
    pids: 128
    env: []
    volumes: []
    edges: []
  - name: credential-broker
    zone: secret
    deploy: true
    database: sqlcipher
    mem: 128m
    cpu: 0.5
    pids: 256
    env:
      - HHUB_SUB
      - HHUB_KEYS
      - HHUB_DB_PATH
      - HHUB_DB_KEY
      - HHUB_KEK_PATH
    volumes:
      - name: keys-credential-broker
        path: /etc/hhub
      - name: broker-data
        path: /data
        rw: true
    edges: []
  - name: egress-gateway
    zone: egress
    database: none
    mem: 64m
    cpu: 0.25
    pids: 128
    env: []
    volumes: []
    edges: []
  - name: model-gateway
    zone: egress
    deploy: true
    database: postgres
    mem: 128m
    cpu: 0.5
    pids: 256
    env:
      - HHUB_SUB
      - HHUB_DSN
      - HHUB_KEYS
      - HHUB_IDENTITY_URL
      - HHUB_SPAWN_URL
      - HHUB_BROKER_URL
    volumes:
      - name: keys-model-gateway
        path: /etc/hhub
    edges:
      - to: spawn-controller
        ops: [ResolveSpec]
      - to: credential-broker
        ops: [Acquire, Revoke]
clients:
  - name: operator
    edges:
      - to: identity-hub
        ops: [ActAs, CreatePrincipal, DeactivateHuman, LinkBegin]
      - to: task-engine
        ops: [CreateJob, GetJob, ListJobs, CancelJob, RetryJob,
              UnquarantineJob, SetHold, GetRun]
      - to: spawn-controller
        ops: [CreateSpace, GetSpace, DestroySpace, DrainRuntime,
              SubmitLayers, Preview, Activate, Rollback, Explain]
      - to: channel-hub
        ops: [Inject, ReadOutbox]
      - to: model-gateway
        ops: [Usage, Routes]
      - to: credential-broker
        ops: [SetSecret, ListConnections, Snapshot]
